:root{--a:#2979ff;--bg:#0f1117;--card:#1a1d2e;--bdr:#2a2d3e;

#score-box{font-size:11px;color:var(--sub);text-align:right;line-height:1.7;flex-shrink:0}

#key-btn{background:var(--bdr);color:var(--tx);border:none;

select{width:100%;padding:9px 10px;font-size:14px;border-radius:8px;

#qtabs::-webkit-scrollbar{height:3px}
#qtabs::-webkit-scrollbar-thumb{background:var(--a);border-radius:2px}
.qtab{flex-shrink:0;min-width:34px;height:32px;border-radius:6px;
      border:1px solid var(--bdr);background:var(--bg);color:var(--sub);
      font-size:11px;cursor:pointer;display:flex;align-items:center;
      justify-content:center;font-weight:bold;transition:.12s;padding:0 4px}

.qtab.ng{background:var(--ng);color:#fff;border-color:var(--ng)}

.cbtn{padding:13px 14px;border-radius:10px;border:2px solid var(--bdr);

.cbtn.ng{border-color:var(--ng)!important;background:rgba(229,57,53,.15)!important}

#qprog{font-size:15px;font-weight:bold}

#modal-btns{display:flex;gap:8px}
#btn-save{flex:1;padding:12px;background:var(--a);color:#fff;border:none;

#btn-cancel{padding:12px 16px;background:var(--bdr);color:var(--tx);

</style>

// セレクター構築
const sel=document.getElementById('exam-sel');
EXAMS.forEach((e,i)=>{
  const o=document.createElement('option');
  o.value=i; o.textContent=e.name; sel.appendChild(o);
});

function loadExam(i){
  if(i<0) return;
  eIdx=i; qNum=1; answers={};
  buildTabs();
  document.getElementById('qtabs').style.display='flex';
  document.getElementById('welcome').style.display='none';
  document.getElementById('qarea').style.display='block';
  document.getElementById('ctrl').style.display='block';
  document.getElementById('s-total').textContent=EXAMS[eIdx].qCount;
  updateKeyBtn();
  updateScore();
  showQ();
}

function buildTabs(){
  const e=EXAMS[eIdx];
  const tabs=document.getElementById('qtabs');
  tabs.innerHTML='';
  for(let q=1;q<=e.qCount;q++){
    const d=document.createElement('div');
    d.className='qtab'; d.id='qt'+q; d.textContent='Q'+q;
    d.onclick=(q=>()=>jumpQ(q))(q);
    tabs.appendChild(d);
  }
}

function jumpQ(q){qNum=q;showQ();}

function showQ(){
  const e=EXAMS[eIdx];
  const qStr=String(qNum);
  const q=e.questions[qStr];
  const a=answers[qNum]||{sel:0};
  const keys=allKeys[eIdx]||{};
  const correctAns=keys[qNum]||0;

  // タブ更新
  document.querySelectorAll('.qtab').forEach(t=>t.classList.remove('active'));
  const at=document.getElementById('qt'+qNum);
  if(at){
    at.classList.remove('active');
    at.classList.add('active');
    at.scrollIntoView({inline:'center',behavior:'smooth'});
  }

  document.getElementById('bp').disabled=qNum<=1;
  document.getElementById('bn').disabled=qNum>=e.qCount;
  document.getElementById('qprog').textContent='Q'+qNum+' / '+e.qCount;
  document.getElementById('qsub').textContent=e.name;

  if(!q){
    document.getElementById('qlabel').textContent='';
    document.getElementById('qtext').innerHTML=
      '<div class="no-q">⚠️ この問題はOCRで取得できませんでした。</div>';
    document.getElementById('choices').innerHTML='';
    document.getElementById('feedback').textContent='';
    document.getElementById('feedback').className='';
    return;
  }

  // 問題文
  document.getElementById('qlabel').textContent='（'+qNum+'）';
  document.getElementById('qtext').innerHTML=
    q.text.replace(/(　　　)/g,'<span class="blank">　　　</span>');

  // フィードバック
  const fb=document.getElementById('feedback');
  if(a.sel && correctAns){
    if(a.sel===correctAns){ fb.textContent='○ 正解！'; fb.className='ok'; }
    else { fb.textContent='✗ 不正解'; fb.className='ng'; }
  } else {
    fb.textContent=''; fb.className='';
  }

  // 選択肢
  const cDiv=document.getElementById('choices');
  cDiv.innerHTML='';
  q.choices.forEach((c,i)=>{
    if(!c) return;
    const n=i+1;
    const btn=document.createElement('button');
    let cls='cbtn';
    if(a.sel){
      if(correctAns){
        if(n===correctAns) cls+=' ok';
        else if(n===a.sel && a.sel!==correctAns) cls+=' ng';
      } else {
        if(n===a.sel) cls+=' reveal';
      }
    }
    btn.className=cls;
    btn.innerHTML='<span class="cn">'+n+'</span><span>'+c+'</span>';
    btn.onclick=(n=>()=>selectAns(n))(n);
    // 一度答えたら選択変更不可
    if(a.sel) btn.disabled=true;
    cDiv.appendChild(btn);
  });

  document.getElementById('qarea').scrollTop=0;
}

function selectAns(n){
  if(answers[qNum]&&answers[qNum].sel) return; // 変更不可
  if(!answers[qNum]) answers[qNum]={sel:0};
  answers[qNum].sel=n;
  updateScore();
  updateTab(qNum);
  showQ();
  // 次の問題へ自動移動（正解がある場合のみ）
  const keys=allKeys[eIdx]||{};
  const correct=keys[qNum]||0;
  if(correct){
    setTimeout(()=>go(1), 700);
  }
}

function updateTab(q){
  const tab=document.getElementById('qt'+q);
  if(!tab) return;
  const a=answers[q];
  const keys=allKeys[eIdx]||{};
  const correct=keys[q]||0;
  tab.classList.remove('ok','ng','done');
  if(!a||!a.sel) return;
  if(correct){
    tab.classList.add(a.sel===correct?'ok':'ng');
  } else {
    tab.classList.add('done');
  }
}

function updateScore(){
  const e=EXAMS[eIdx]; if(!e) return;
  const keys=allKeys[eIdx]||{};
  let done=0,ok=0,ng=0;
  for(let q=1;q<=e.qCount;q++){
    const a=answers[q];
    if(!a||!a.sel) continue;
    done++;
    const c=keys[q]||0;
    if(c){ if(a.sel===c) ok++; else ng++; }
  }
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-ok').textContent=ok;
  document.getElementById('s-ng').textContent=ng;
}

function go(dir){
  const e=EXAMS[eIdx];
  const next=qNum+dir;
  if(next>=1&&next<=e.qCount){qNum=next;showQ();}
}

// ── 正解キーモーダル ──────────────────────────────
function openKeyModal(){
  if(eIdx<0) return;
  const e=EXAMS[eIdx];
  const keys=allKeys[eIdx]||{};
  const grid=document.getElementById('key-grid');
  grid.innerHTML='';
  for(let q=1;q<=e.qCount;q++){
    const div=document.createElement('div');
    div.className='key-item';
    const label=document.createElement('label');
    label.textContent='Q'+q;
    const s=document.createElement('select');
    s.id='key-q'+q;
    s.innerHTML='<option value="0">-</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>';
    s.value=keys[q]||0;
    if(s.value!='0') s.classList.add('filled');
    s.onchange=()=>{ s.classList.toggle('filled',s.value!='0'); };
    div.appendChild(label);
    div.appendChild(s);
    grid.appendChild(div);
  }
  document.getElementById('modal-overlay').classList.add('open');
}

function closeKeyModal(){
  document.getElementById('modal-overlay').classList.remove('open');
}

function saveKeys(){
  const e=EXAMS[eIdx];
  if(!allKeys[eIdx]) allKeys[eIdx]={};
  for(let q=1;q<=e.qCount;q++){
    const s=document.getElementById('key-q'+q);
    if(s&&s.value!='0') allKeys[eIdx][q]=+s.value;
  }
  updateKeyBtn();
  closeKeyModal();
  // 全タブの色を更新
  for(let q=1;q<=e.qCount;q++) updateTab(q);
  updateScore();
  showQ();
}

function updateKeyBtn(){
  const keys=allKeys[eIdx]||{};
  const count=Object.keys(keys).length;
  const btn=document.getElementById('key-btn');
  if(count>0){
    btn.textContent='🔑 '+count+'問入力済';
    btn.classList.add('set');
  } else {
    btn.textContent='🔑 正解入力';
    btn.classList.remove('set');
  }
}

// スワイプ
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=tx-e.changedTouches[0].clientX;
  if(Math.abs(dx)>60){if(dx>0)go(1);else go(-1);}
},{passive:true});

// キーボード
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.key==='ArrowRight')go(1);
  if(e.key==='ArrowLeft')go(-1);
  if(e.key>='1'&&e.key<='4')selectAns(+e.key);
});
</script>
