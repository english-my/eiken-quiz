<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=3.0">
<title>英検1級 大問1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--a:#2979ff;--bg:#0f1117;--card:#1a1d2e;--bdr:#2a2d3e;
      --tx:#e8e8e8;--sub:#777;--ok:#43a047;--ng:#e53935;--sel:#1565c0}
body{font-family:-apple-system,'Hiragino Sans',sans-serif;
     background:var(--bg);color:var(--tx);height:100dvh;
     display:flex;flex-direction:column;overflow:hidden}

/* ── ヘッダー ── */
#hdr{background:var(--card);padding:8px 12px;
     border-bottom:2px solid var(--a);flex-shrink:0;
     display:flex;align-items:center;justify-content:space-between;gap:8px}
#hdr h1{font-size:14px;color:var(--a);font-weight:bold;white-space:nowrap}
#score-box{font-size:11px;color:var(--sub);text-align:right;line-height:1.7;flex-shrink:0}
#score-box b{font-size:13px}
#key-btn{background:var(--bdr);color:var(--tx);border:none;
         padding:7px 10px;border-radius:7px;font-size:12px;
         cursor:pointer;white-space:nowrap;flex-shrink:0}
#key-btn.set{background:#1565c0;color:#fff}

/* ── セレクター ── */
#selbar{background:var(--card);padding:7px 10px;
        border-bottom:1px solid var(--bdr);flex-shrink:0}
select{width:100%;padding:9px 10px;font-size:14px;border-radius:8px;
       background:var(--bg);color:var(--tx);border:1px solid var(--a);
       outline:none;-webkit-appearance:none}

/* ── Q番号タブ ── */
#qtabs{display:flex;overflow-x:auto;background:var(--card);
       padding:5px 8px;gap:4px;border-bottom:1px solid var(--bdr);
       flex-shrink:0;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
#qtabs::-webkit-scrollbar{height:3px}
#qtabs::-webkit-scrollbar-thumb{background:var(--a);border-radius:2px}
.qtab{flex-shrink:0;min-width:34px;height:32px;border-radius:6px;
      border:1px solid var(--bdr);background:var(--bg);color:var(--sub);
      font-size:11px;cursor:pointer;display:flex;align-items:center;
      justify-content:center;font-weight:bold;transition:.12s;padding:0 4px}
.qtab.active{background:var(--a)!important;color:#fff!important;border-color:var(--a)!important}
.qtab.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.qtab.ng{background:var(--ng);color:#fff;border-color:var(--ng)}
.qtab.done{background:#37474f;color:#ccc;border-color:#37474f}

/* ── 問題エリア ── */
#qarea{flex:1;overflow-y:auto;padding:14px 14px 4px;
       -webkit-overflow-scrolling:touch}
#qlabel{font-size:12px;color:var(--sub);margin-bottom:6px}
#qtext{font-size:16px;line-height:2;color:var(--tx);
       margin-bottom:14px;letter-spacing:.02em}
#qtext .blank{display:inline-block;min-width:90px;
              border-bottom:2px solid var(--a);
              text-align:center;margin:0 2px;color:var(--a);font-weight:bold}
.no-q{color:var(--sub);font-size:14px;background:var(--card);
      border-radius:8px;padding:14px;line-height:1.8}

/* ── 選択肢 ── */
#choices{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.cbtn{padding:13px 14px;border-radius:10px;border:2px solid var(--bdr);
      background:var(--card);color:var(--tx);font-size:15px;cursor:pointer;
      text-align:left;display:flex;align-items:flex-start;gap:10px;
      -webkit-tap-highlight-color:transparent;line-height:1.5;transition:.12s}
.cbtn .cn{font-weight:bold;color:var(--sub);flex-shrink:0;min-width:20px}
.cbtn.ok{border-color:var(--ok)!important;background:rgba(67,160,71,.2)!important;color:#fff}
.cbtn.ng{border-color:var(--ng)!important;background:rgba(229,57,53,.15)!important}
.cbtn.reveal{border-color:var(--ok);background:rgba(67,160,71,.1)}
.cbtn:active:not(.ok):not(.ng){opacity:.75}

/* ── 正誤フィードバック ── */
#feedback{text-align:center;font-size:22px;font-weight:bold;
          padding:6px 0 10px;min-height:42px}
#feedback.ok{color:var(--ok)}
#feedback.ng{color:var(--ng)}

/* ── ナビ ── */
#ctrl{background:var(--card);border-top:1px solid var(--bdr);
      padding:9px 12px 14px;flex-shrink:0}
#nav-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nbtn{background:var(--bdr);color:var(--tx);border:none;
      padding:11px 18px;border-radius:8px;font-size:14px;
      cursor:pointer;font-weight:bold;
      -webkit-tap-highlight-color:transparent;flex-shrink:0}
.nbtn:disabled{opacity:.3}
.nbtn:active:not(:disabled){opacity:.7}
#qinfo{text-align:center;flex:1}
#qprog{font-size:15px;font-weight:bold}
#qsub{font-size:11px;color:var(--sub);margin-top:2px}

/* ── ウェルカム ── */
#welcome{flex:1;display:flex;flex-direction:column;align-items:center;
         justify-content:center;text-align:center;padding:30px;gap:14px}
#welcome .ico{font-size:48px}
#welcome p{font-size:15px;line-height:2.2;color:var(--sub)}

/* ── 正解キー入力モーダル ── */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
               z-index:100;align-items:center;justify-content:center;padding:16px}
#modal-overlay.open{display:flex}
#modal{background:var(--card);border-radius:14px;width:100%;max-width:480px;
       max-height:85vh;overflow-y:auto;padding:18px}
#modal h2{font-size:15px;color:var(--a);margin-bottom:6px}
#modal p{font-size:12px;color:var(--sub);margin-bottom:14px;line-height:1.7}
#key-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.key-item{display:flex;flex-direction:column;align-items:center;gap:3px}
.key-item label{font-size:10px;color:var(--sub)}
.key-item select{width:52px;padding:6px 2px;font-size:14px;border-radius:6px;
                 background:var(--bg);color:var(--tx);border:1px solid var(--bdr);
                 text-align:center;outline:none;cursor:pointer}
.key-item select.filled{border-color:var(--a);color:var(--a)}
#modal-btns{display:flex;gap:8px}
#btn-save{flex:1;padding:12px;background:var(--a);color:#fff;border:none;
          border-radius:9px;font-size:15px;font-weight:bold;cursor:pointer}
#btn-cancel{padding:12px 16px;background:var(--bdr);color:var(--tx);
            border:none;border-radius:9px;font-size:15px;cursor:pointer}
</style>
</head>
<body>

<!-- ヘッダー -->
<div id="hdr">
  <h1>英検1級 大問1</h1>
  <button id="key-btn" onclick="openKeyModal()">🔑 正解入力</button>
  <div id="score-box">
    解答 <b id="s-done">0</b>/<span id="s-total">-</span><br>
    正解 <b id="s-ok" style="color:var(--ok)">0</b>
    不正解 <b id="s-ng" style="color:var(--ng)">0</b>
  </div>
</div>

<!-- セレクター -->
<div id="selbar">
  <select id="exam-sel" onchange="loadExam(+this.value)">
    <option value="-1">▼ 年度・回を選んでください</option>
  </select>
</div>

<!-- Q番号タブ -->
<div id="qtabs" style="display:none"></div>

<!-- ウェルカム -->
<div id="welcome">
  <div class="ico">📝</div>
  <p>① 年度を選ぶ<br>
     ② 「🔑 正解入力」で答えを入力（任意）<br>
     ③ 選択肢を選ぶ → 自動で正誤表示</p>
</div>

<!-- 問題エリア -->
<div id="qarea" style="display:none">
  <div id="qlabel"></div>
  <div id="qtext"></div>
  <div id="choices"></div>
  <div id="feedback"></div>
</div>

<!-- ナビ -->
<div id="ctrl" style="display:none">
  <div id="nav-row">
    <button class="nbtn" onclick="go(-1)" id="bp">◀ 前</button>
    <div id="qinfo">
      <div id="qprog">-</div>
      <div id="qsub"></div>
    </div>
    <button class="nbtn" onclick="go(1)" id="bn">次 ▶</button>
  </div>
</div>

<!-- 正解キー入力モーダル -->
<div id="modal-overlay">
  <div id="modal">
    <h2>🔑 正解番号を入力</h2>
    <p>解答冊子を見ながら各問題の正解番号(1〜4)を入力してください。<br>
       入力後、選択肢を選ぶと自動で○✗が表示されます。</p>
    <div id="key-grid"></div>
    <div id="modal-btns">
      <button id="btn-cancel" onclick="closeKeyModal()">キャンセル</button>
      <button id="btn-save" onclick="saveKeys()">✓ 設定する</button>
    </div>
  </div>
</div>

": ["shoal", "hoax", "gorge", "cordon"], "raw_c": "1 shoal 2 hoax 3 gorge 4 cordon", "answer": 4}, "9": {"text": "When the king's daughter married the prince of a neighboring country, the king said, \"This （　　　） occasion represents the union of two nations!\"", "choices": ["copious", "momentous", "voracious", "extraneous"], "raw_c": "1 copious 2 momentous 3 voracious 4 extraneous", "answer": 2}, "10": {"text": "A: Do I really have to stay in the hospital another night, Doctor?\nB: Unfortunately, yes. There seems to be an （　　　） in your blood test results, Mr. Peters. I'd like to do more tests to find out what the problem is.", "choices": ["insurrection", "anomaly", "increment", "oracle"], "raw_c": "1 insurrection 2 anomaly 3 increment 4 oracle", "answer": 2}, "11": {"text": "When the war memorial was completed, a ceremony was held to （　　　） it to the memory of the soldiers who had given their lives for their country.", "choices": ["encapsulate", "consecrate", "envelop", "conscript"], "raw_c": "1 encapsulate 2 consecrate 3 envelop 4 conscript", "answer": 2}, "12": {"text": "After （　　　） in prison for 20 years, Jake was finally released. He greatly regretted both his crime and the years of his life that had been wasted because of it.", "choices": ["languishing", "gargling", "lurching", "disembarking"], "raw_c": "1 languishing 2 gargling 3 lurching 4 disembarking", "answer": 1}, "13": {"text": "The new chief editor told her staff it was time to （　　　） the fashion magazine to win back readers. \"The new look should be bold and stylish,\" she said.", "choices": ["rebuff", "revile", "revamp", "retard"], "raw_c": "1 rebuff 2 revile 3 revamp 4 retard", "answer": 3}, "14": {"text": "A: Wilson, if I fall asleep during the principal's speech, will you give me a （　　　） to wake me up?\nB: Sure, Sofia. But only if I don't fall asleep as well!", "choices": ["ledge", "stitch", "pitch", "nudge"], "raw_c": "1 ledge 2 stitch 3 pitch 4 nudge", "answer": 4}, "15": {"text": "After several people died from taking the new flu medication, it was banned by the government. It turns out the medication can be （　　　） if taken with certain other drugs.", "choices": ["vexing", "covetous", "lethal", "unequivocal"], "raw_c": "1 vexing 2 covetous 3 lethal 4 unequivocal", "answer": 3}, "16": {"text": "This travel guide for Hawaii has information on a wide range of accommodations, from the most （　　　） resort hotels to basic discount motels.", "choices": ["jaded", "foolhardy", "opulent", "plaintive"], "raw_c": "1 jaded 2 foolhardy 3 opulent 4 plaintive", "answer": 3}, "17": {"text": "More than 260 awards, including the Nobel Peace Prize, were （　　　） on Nelson Mandela for his work in fighting racial discrimination in South Africa.", "choices": ["bestowed", "exonerated", "pollinated", "masqueraded"], "raw_c": "1 bestowed 2 exonerated 3 pollinated 4 masqueraded", "answer": 1}, "18": {"text": "Allen knew his comic book collection would someday be valuable, so he kept it in （　　　） condition, refusing to let anyone touch it.", "choices": ["unwitting", "debonair", "poignant", "pristine"], "raw_c": "1 unwitting 2 debonair 3 poignant 4 pristine", "answer": 4}, "19": {"text": "In exchange for acting as a witness against his former crime boss, the gangster was granted （　　　） from prosecution and allowed to go free.", "choices": ["immunity", "undertone", "turmoil", "transgression"], "raw_c": "1 immunity 2 undertone 3 turmoil 4 transgression", "answer": 1}, "20": {"text": "Although western Colorado is usually quite dry throughout the summer, the amount of （　　　） this year has been unusually high.", "choices": ["voltage", "precipitation", "leverage", "annexation"], "raw_c": "1 voltage 2 precipitation 3 leverage 4 annexation", "answer": 2}, "21": {"text": "\"It is the courage and selflessness （　　　） by fine soldiers like you that form the core of our national spirit,\" the general told the troops at the victory parade.", "choices": ["rankled", "trudged", "exemplified", "exasperated"], "raw_c": "1 rankled 2 trudged 3 exemplified 4 exasperated", "answer": 3}, "22": {"text": "After ignoring his work for most of the semester, Enrique （　　　） and studied hard for the last two weeks. It was too late, though, and he received poor grades.", "choices": ["buckled down", "polished off", "ironed out", "flaked off"], "raw_c": "1 buckled down 2 polished off 3 ironed out 4 flaked off", "answer": 1}, "23": {"text": "While the other runners went as fast as possible from the start of the race, Tom （　　　） and waited. Then, when the others were tired, he ran at full speed and passed them.", "choices": ["hung back", "rode on", "beefed up", "roped in"], "raw_c": "1 hung back 2 rode on 3 beefed up 4 roped in", "answer": 1}, "24": {"text": "A: What do you think of my idea for a TV commercial, Hank?\nB: Well, it would be a lot of work. You'd better （　　　） the manager to see what he thinks about starting such a big project.", "choices": ["pine for", "cave in", "bunch up", "sound out"], "raw_c": "1 pine for 2 cave in 3 bunch up 4 sound out", "answer": 4}, "25": {"text": "The new employee stayed at the office very late working on the report he had been asked to write. He did not want to （　　　） his first chance to impress his boss.", "choices": ["sift through", "louse up", "reel in", "hinge on"], "raw_c": "1 sift through 2 louse up 3 reel in 4 hinge on", "answer": 2}, "7": {"text": "Bill attends an elite university, so his professors are among the most （　　　） people in their fields. He feels honored to be taught by such highly respected scholars.", "choices": ["volatile", "eminent", "assailable", "repugnant"], "raw_c": "1 volatile 2 eminent 3 assailable 4 repugnant", "answer": 2}}}, {"name": "２０１６年度第２回", "year": 2016, "qCount": 25, "questions": {"1": {"text": "For many years, the old man lived in the mountains as a （　　　）. He isolated himself from society and devoted his time to spirituality and prayer.", "choices": ["prodigy", "hermit", "glutton", "suitor"], "raw_c": "1 prodigy 2 hermit 3 glutton 4 suitor", "answer": 2}, "2": {"text": "When asked about his divorce, the actor blamed the （　　　） of his marriage on the pressures of work. \"I've been unable to devote any time to my family,\" he said.", "choices": ["reparation", "protrusion", "disintegration", "pretension"], "raw_c": "1 reparation 2 protrusion 3 disintegration 4 pretension", "answer": 1}, "3": {"text": "A: How was the company president's speech, Colin?\nB: It was pretty （　　　）, to be honest. He didn't have anything particularly original or motivational to say.", "choices": ["banal", "quaint", "pungent", "exuberant"], "raw_c": "1 banal 2 quaint 3 pungent 4 exuberant", "answer": 1}, "4": {"text": "The （　　　） tone of the politician's speech upset many viewers. They felt he should have been more respectful to his opponents.", "choices": ["precursory", "derisive", "reciprocated", "conscientious"], "raw_c": "1 precursory 2 derisive 3 reciprocated 4 conscientious", "answer": 2}, "5": {"text": "Whenever anyone approached the abandoned dog, it （　　　） with fear. It had obviously been treated badly by its former owners.", "choices": ["cringed", "bungled", "scoured", "billowed"], "raw_c": "1 cringed 2 bungled 3 scoured 4 billowed", "answer": 1}, "6": {"text": "The village was strongly （　　　） of the one Dave had lived in as a child. Visiting it put him in a nostalgic mood.", "choices": ["reminiscent", "discursive", "spellbound", "egregious"], "raw_c": "1 reminiscent 2 discursive 3 spellbound 4 egregious", "answer": 1}, "7": {"text": "The politician argued against the sales tax on the （　　　） that people would buy fewer goods if they cost more.", "choices": ["premise", "array", "clump", "nuisance"], "raw_c": "1 premise 2 array 3 clump 4 nuisance", "answer": 1}, "8": {"text": "A: This tea is very weak.\nB: You probably didn't （　　　） it long enough. You need to leave the tea bag in the hot water for about three minutes.", "choices": ["deface", "shear", "usher", "brew"], "raw_c": "1 deface 2 shear 3 usher 4 br // セレクター構築
const sel=document.getElementById('exam-sel');
EXAMS.forEach((e,i)=>{
  const o=document.createElement('option');
  o.value=i; o.textContent=e.name; sel.appendChild(o);
});

function loadExam(i){
  if(i<0) return;
  eIdx=i; qNum=1; answers={};
  buildTabs();
  document.getElementById('qtabs').style.display='flex';
  document.getElementById('welcome').style.display='none';
  document.getElementById('qarea').style.display='block';
  document.getElementById('ctrl').style.display='block';
  document.getElementById('s-total').textContent=EXAMS[eIdx].qCount;
  updateKeyBtn();
  updateScore();
  showQ();
}

function buildTabs(){
  const e=EXAMS[eIdx];
  const tabs=document.getElementById('qtabs');
  tabs.innerHTML='';
  for(let q=1;q<=e.qCount;q++){
    const d=document.createElement('div');
    d.className='qtab'; d.id='qt'+q; d.textContent='Q'+q;
    d.onclick=(q=>()=>jumpQ(q))(q);
    tabs.appendChild(d);
  }
}

function jumpQ(q){qNum=q;showQ();}

function showQ(){
  const e=EXAMS[eIdx];
  const qStr=String(qNum);
  const q=e.questions[qStr];
  const a=answers[qNum]||{sel:0};
  const keys=allKeys[eIdx]||{};
  const correctAns=keys[qNum]||0;

  // タブ更新
  document.querySelectorAll('.qtab').forEach(t=>t.classList.remove('active'));
  const at=document.getElementById('qt'+qNum);
  if(at){
    at.classList.remove('active');
    at.classList.add('active');
    at.scrollIntoView({inline:'center',behavior:'smooth'});
  }

  document.getElementById('bp').disabled=qNum<=1;
  document.getElementById('bn').disabled=qNum>=e.qCount;
  document.getElementById('qprog').textContent='Q'+qNum+' / '+e.qCount;
  document.getElementById('qsub').textContent=e.name;

  if(!q){
    document.getElementById('qlabel').textContent='';
    document.getElementById('qtext').innerHTML=
      '<div class="no-q">⚠️ この問題はOCRで取得できませんでした。</div>';
    document.getElementById('choices').innerHTML='';
    document.getElementById('feedback').textContent='';
    document.getElementById('feedback').className='';
    return;
  }

  // 問題文
  document.getElementById('qlabel').textContent='（'+qNum+'）';
  document.getElementById('qtext').innerHTML=
    q.text.replace(/(　　　)/g,'<span class="blank">　　　</span>');

  // フィードバック
  const fb=document.getElementById('feedback');
  if(a.sel && correctAns){
    if(a.sel===correctAns){ fb.textContent='○ 正解！'; fb.className='ok'; }
    else { fb.textContent='✗ 不正解'; fb.className='ng'; }
  } else {
    fb.textContent=''; fb.className='';
  }

  // 選択肢
  const cDiv=document.getElementById('choices');
  cDiv.innerHTML='';
  q.choices.forEach((c,i)=>{
    if(!c) return;
    const n=i+1;
    const btn=document.createElement('button');
    let cls='cbtn';
    if(a.sel){
      if(correctAns){
        if(n===correctAns) cls+=' ok';
        else if(n===a.sel && a.sel!==correctAns) cls+=' ng';
      } else {
        if(n===a.sel) cls+=' reveal';
      }
    }
    btn.className=cls;
    btn.innerHTML='<span class="cn">'+n+'</span><span>'+c+'</span>';
    btn.onclick=(n=>()=>selectAns(n))(n);
    // 一度答えたら選択変更不可
    if(a.sel) btn.disabled=true;
    cDiv.appendChild(btn);
  });

  document.getElementById('qarea').scrollTop=0;
}

function selectAns(n){
  if(answers[qNum]&&answers[qNum].sel) return; // 変更不可
  if(!answers[qNum]) answers[qNum]={sel:0};
  answers[qNum].sel=n;
  updateScore();
  updateTab(qNum);
  showQ();
  // 次の問題へ自動移動（正解がある場合のみ）
  const keys=allKeys[eIdx]||{};
  const correct=keys[qNum]||0;
  if(correct){
    setTimeout(()=>go(1), 700);
  }
}

function updateTab(q){
  const tab=document.getElementById('qt'+q);
  if(!tab) return;
  const a=answers[q];
  const keys=allKeys[eIdx]||{};
  const correct=keys[q]||0;
  tab.classList.remove('ok','ng','done');
  if(!a||!a.sel) return;
  if(correct){
    tab.classList.add(a.sel===correct?'ok':'ng');
  } else {
    tab.classList.add('done');
  }
}

function updateScore(){
  const e=EXAMS[eIdx]; if(!e) return;
  const keys=allKeys[eIdx]||{};
  let done=0,ok=0,ng=0;
  for(let q=1;q<=e.qCount;q++){
    const a=answers[q];
    if(!a||!a.sel) continue;
    done++;
    const c=keys[q]||0;
    if(c){ if(a.sel===c) ok++; else ng++; }
  }
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-ok').textContent=ok;
  document.getElementById('s-ng').textContent=ng;
}

function go(dir){
  const e=EXAMS[eIdx];
  const next=qNum+dir;
  if(next>=1&&next<=e.qCount){qNum=next;showQ();}
}

    label.textContent='Q'+q;
    const s=document.createElement('select');
    s.id='key-q'+q;
    s.innerHTML='<option value="0">-</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>';
    s.value=keys[q]||0;
    if(s.value!='0') s.classList.add('filled');
    s.onchange=()=>{ s.classList.toggle('filled',s.value!='0'); };
    div.appendChild(label);
    div.appendChild(s);
    grid.appendChild(div);
  }
  document.getElementById('modal-overlay').classList.add('open');
}

function closeKeyModal(){
  document.getElementById('modal-overlay').classList.remove('open');
}

function saveKeys(){
  const e=EXAMS[eIdx];
  if(!allKeys[eIdx]) allKeys[eIdx]={};
  for(let q=1;q<=e.qCount;q++){
    const s=document.getElementById('key-q'+q);
    if(s&&s.value!='0') allKeys[eIdx][q]=+s.value;
  }
  updateKeyBtn();
  closeKeyModal();
  // 全タブの色を更新
  for(let q=1;q<=e.qCount;q++) updateTab(q);
  updateScore();
  showQ();
}

function updateKeyBtn(){
  const keys=allKeys[eIdx]||{};
  const count=Object.keys(keys).length;
  const btn=document.getElementById('key-btn');
  if(count>0){
    btn.textContent='🔑 '+count+'問入力済';
    btn.classList.add('set');
  } else {
    btn.textContent='🔑 正解入力';
    btn.classList.remove('set');
  }
}

// スワイプ
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=tx-e.changedTouches[0].clientX;
  if(Math.abs(dx)>60){if(dx>0)go(1);else go(-1);}
},{passive:true});

// キーボード
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.key==='ArrowRight')go(1);
  if(e.key==='ArrowLeft')go(-1);
  if(e.key>='1'&&e.key<='4')selectAns(+e.key);
});
</script>
</body>
